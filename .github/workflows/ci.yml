name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-flake:
    name: Check flake
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure runner defaults
        run: |
          git config --global init.defaultBranch main
          sudo sed -i -E \
            -e 's/^[#[:space:]]*SYS_UID_MAX[[:space:]]+.*/SYS_UID_MAX 39999/' \
            -e 's/^[#[:space:]]*SYS_GID_MAX[[:space:]]+.*/SYS_GID_MAX 39999/' \
            /etc/login.defs

      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Nix
        # cachix/install-nix-action v31.10.6
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            trusted-users = root runner

      - name: Check flake
        run: nix flake check --all-systems --no-build --no-update-lock-file

  lint-and-format:
    name: Lint and secret validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure runner defaults
        run: |
          git config --global init.defaultBranch main
          sudo sed -i -E \
            -e 's/^[#[:space:]]*SYS_UID_MAX[[:space:]]+.*/SYS_UID_MAX 39999/' \
            -e 's/^[#[:space:]]*SYS_GID_MAX[[:space:]]+.*/SYS_GID_MAX 39999/' \
            /etc/login.defs

      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Nix
        # cachix/install-nix-action v31.10.6
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            trusted-users = root runner

      - name: Build lint and SOPS checks
        run: |
          nix build --no-link --no-update-lock-file --print-build-logs \
            .#checks.x86_64-linux.pre-commit-check \
            .#checks.x86_64-linux.chetter-sops-manifest

  build:
    name: Plan NixOS build (${{ matrix.host }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [eto, chetter, virgil]
    steps:
      - name: Configure runner defaults
        run: |
          git config --global init.defaultBranch main
          sudo sed -i -E \
            -e 's/^[#[:space:]]*SYS_UID_MAX[[:space:]]+.*/SYS_UID_MAX 39999/' \
            -e 's/^[#[:space:]]*SYS_GID_MAX[[:space:]]+.*/SYS_GID_MAX 39999/' \
            /etc/login.defs

      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Nix
        # cachix/install-nix-action v31.10.6
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            trusted-users = root runner

      - name: Plan ${{ matrix.host }} build (dry-run)
        run: |
          nix build --dry-run --no-link --no-update-lock-file \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
